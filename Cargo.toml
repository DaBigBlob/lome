[workspace]
resolver = "2"
members = ["crates/lome0", "crates/lome1"]

[workspace.dependencies]
lome0 = { version = "0.1.0", path = "crates/lome0" }
lome1 = { version = "0.1.0", path = "crates/lome1" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["Hans S. <hans@0x8.io>"]
description = ""
repository = "https://github.com/DaBigBlob/lome"
readme = "README.md"

# --release
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false

# --profile small
[profile.small]
inherits = "release"
opt-level = "z"
